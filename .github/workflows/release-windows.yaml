name: 构建 Windows 应用

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 Release
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 克隆仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 读取版本并校验发布标签
        id: version
        run: |
          $versionLine = Get-Content -LiteralPath pubspec.yaml | Where-Object { $_ -match '^version:\s*(\S+)\s*$' } | Select-Object -First 1
          if (-not $versionLine -or $versionLine -notmatch '^version:\s*([0-9A-Za-z.+-]+)\s*$') {
            throw '无法从 pubspec.yaml 读取版本号。'
          }
          $version = $Matches[1]
          $versionName = $version.Split('+')[0]
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -cne "v$versionName") {
            throw "标签 $env:GITHUB_REF_NAME 与 pubspec.yaml 版本 $versionName 不一致。"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "version_name=$versionName" >> $env:GITHUB_OUTPUT

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get --enforce-lockfile

      - name: 静态检查
        run: dart analyze

      - name: 自动化测试
        run: flutter test --no-pub

      - name: 构建 Windows Release
        run: flutter build windows --release --no-pub

      - name: 补齐 Visual C++ 运行库
        run: |
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'build\windows\x64\runner\Release'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $visualStudioPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $visualStudioPath) {
            throw '未找到 Visual Studio C++ 工具链。'
          }
          $runtime = Get-ChildItem -Path (Join-Path $visualStudioPath 'VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT') -Directory |
            Sort-Object { [version]$_.Parent.Parent.Name } -Descending | Select-Object -First 1
          if (-not $runtime) { throw '未找到 x64 Visual C++ 运行库。' }
          # 运行库随应用目录分发，便携包和安装包共用同一份完整 Bundle。
          foreach ($name in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            $source = Join-Path $runtime.FullName $name
            if (-not (Test-Path -LiteralPath $source)) { throw "缺少运行库：$name" }
            Copy-Item -LiteralPath $source -Destination $bundle
          }

      - name: 生成便携包与校验和
        run: ./windows/package.ps1

      - name: 生成安装包与校验和
        env:
          APP_VERSION: ${{ steps.version.outputs.version_name }}
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw '未找到 Inno Setup 6。' }
          $bundle = Join-Path $env:GITHUB_WORKSPACE 'build\windows\x64\runner\Release'
          $output = Join-Path $env:GITHUB_WORKSPACE 'build\windows-distribution'
          & $compiler "/DAppVersion=$env:APP_VERSION" "/DBundleDir=$bundle" "/DOutputDir=$output" 'windows/installer.iss'
          if ($LASTEXITCODE -ne 0) { throw "安装包编译失败：$LASTEXITCODE" }
          $installer = Join-Path $output "bobomusic-$env:APP_VERSION-windows-x64-setup.exe"
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($installer))" | Set-Content -LiteralPath "$installer.sha256" -Encoding ascii

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v7
        with:
          name: bobomusic-${{ steps.version.outputs.version }}-windows-x64
          path: build/windows-distribution/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: 发布 Windows 产物
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # 与 Android 共用发布锁；构建并行，写入同一 Release 时串行。
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: 下载 Windows 产物
        uses: actions/download-artifact@v8
        with:
          name: bobomusic-${{ needs.build.outputs.version }}-windows-x64
          path: distribution

      - name: 上传到对应版本的 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            distribution/*.zip
            distribution/*.exe
            distribution/*.sha256
          fail_on_unmatched_files: true
