org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
android.useAndroidX=true
# Jetifier 已在 AGP 9 移除；本项目依赖全为 AndroidX，无需它
# 钉 JDK 17（Gradle 9 硬要求；本机 JAVA_HOME=D:\java 是 JDK 8，不能依赖它）
org.gradle.java.home=C\:\\Program Files\\Java\\jdk-17.0.12
org.gradle.daemon=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# 注意：不设 android.newDsl=false——它强制 AGP 9 回退旧 DSL，与 KGP 2.4 组合
# 会产生 Kotlin internal 类跨文件 unresolved（share_plus 两版本同症状实证）

# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
