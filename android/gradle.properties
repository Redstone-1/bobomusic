org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
android.useAndroidX=true
# Jetifier 已在 AGP 9 移除；本项目依赖全为 AndroidX，无需它
# JDK 17 钉定放用户级 ~/.gradle/gradle.properties（机器特定路径不进版本库；
# CI 由 setup-java 提供 JDK）。本机文件已建，删此行后本地构建不受影响
org.gradle.daemon=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# 注意：不设 android.newDsl=false——它强制 AGP 9 回退旧 DSL，与 KGP 2.4 组合
# 会产生 Kotlin internal 类跨文件 unresolved（share_plus 两版本同症状实证）

# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
