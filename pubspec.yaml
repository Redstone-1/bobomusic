name: bobomusic
description: '啵啵音乐，听歌自由'
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# 重写版版本号（D5 修订 2026-10-25）：App 已发布至 2.7.0，本次重写为第三代 → 3.0.0 起；
# versionCode 账本（发布时必须延续递增）：3.0.0=300（本地打包）；3.0.1=301（CI 打包）；
# 3.0.2=302（CI 打包）
version: 3.0.2+302

environment:
  sdk: '>=3.3.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # 状态管理（D8：Riverpod 3 + codegen）
  flutter_riverpod: ^3.4.0
  riverpod_annotation: ^4.0.7

  # 网络与音源
  dio: ^5.8.0+1
  crypto: ^3.0.6

  # 播放内核（S4 接入；桌面解码后端为 media_kit）
  # 系统媒体会话/通知为自研（lib/features/player/system_media_center.dart + android MediaCenterService）
  just_audio: ^0.10.6
  media_kit_libs_linux: ^1.1.3
  media_kit_libs_windows_audio: ^1.0.9
  just_audio_media_kit: ^2.1.0
  media_kit_native_event_loop: ^1.0.8

  # 数据与存储
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.3 # Windows/Linux 桌面运行时必需（不再是纯 dev 依赖）
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_cache_manager: ^3.4.0
  cached_network_image: ^4.0.4

  # 系统能力与信息
  # permission_handler 钉 12.x：13.x 的 Android 子包要求 compileSdk 37，超出 Flutter 3.47 工具链矩阵
  permission_handler: ^12.0.0
  url_launcher: ^6.3.1
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  file_picker: ^13.2.0
  # share_plus 钉 13.1.x：13.2.0 起迁移 AGP 内置 Kotlin，其 KGP 回退路径在 AGP 9 宿主下编译丢类；
  # 而 12.x 依赖 win32 5.x 与 plus 家族 13 线（win32 6.x）互斥，故锁 13.0~13.1 窗口
  share_plus: ">=13.0.0 <13.2.0"

  # 本地音乐元数据读取（S3 本地扫描用，§8 未单列）
  audio_metadata_reader: ^1.1.0

  # UI
  bot_toast: ^4.1.3
  flutter_svg: ^2.0.17
  flutter_lyric: ^4.1.0
  markdown_widget: ^2.2.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

  # Riverpod codegen 工具链（lint 走 Dart 3.10+ 新 analyzer 插件系统，无需 custom_lint）
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9

# For information on the generic Dart part of this file, see the following page:
# https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application.  Use with the Icons class that uses
  # the package's fonts.
  uses-material-design: true

  fonts:
    - family: BBIcons
      fonts:
        - asset: assets/icons/icon.ttf

  assets:
    - assets/
    - assets/markdown/
    - assets/illustrations/ # 空态插画（undraw 提取，主色已换主题青绿）
