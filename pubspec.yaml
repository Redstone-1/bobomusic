name: bobomusic
description: '啵啵音乐，听歌自由'
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# 重写版版本号（D5）：2.0.0 起；
# 发布时 build number（+N）必须高于旧版最后一个正式包的 versionCode，由所有者发布前手动确认
version: 2.0.0

environment:
  sdk: '>=3.3.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # 状态管理（D8：Riverpod 3 + codegen）
  flutter_riverpod: ^3.4.0
  riverpod_annotation: ^4.0.7

  # 网络与音源
  dio: ^5.8.0+1
  crypto: ^3.0.6

  # 播放内核（S4 接入；桌面解码后端为 media_kit）
  just_audio: ^0.9.39
  audio_service: ^0.18.13
  media_kit_libs_linux: ^1.1.3
  media_kit_libs_windows_audio: ^1.0.9
  just_audio_media_kit: ^2.1.0
  media_kit_native_event_loop: ^1.0.8

  # 数据与存储
  sqflite: ^2.4.1
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_cache_manager: ^3.4.0
  cached_network_image: ^3.4.0

  # 系统能力与信息
  permission_handler: ^11.3.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.0.2
  device_info_plus: ^11.2.0
  window_manager: ^0.4.2
  file_picker: ^8.1.2
  share_plus: ^10.1.2

  # 本地音乐元数据读取（S3 本地扫描用，§8 未单列）
  audio_metadata_reader: ^1.1.0

  # UI
  bot_toast: ^4.1.3
  flutter_svg: ^2.0.17
  flutter_lyric: ^2.0.4+6
  markdown_widget: ^2.2.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

  # Riverpod codegen 工具链（lint 走 Dart 3.10+ 新 analyzer 插件系统，无需 custom_lint）
  build_runner: ^2.4.13
  riverpod_generator: ^4.0.9
  riverpod_lint: ^3.1.9
  # 桌面端/单测用 sqlite（S3 数据层单测）
  sqflite_common_ffi: ^2.3.3

# For information on the generic Dart part of this file, see the following page:
# https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application.  Use with the Icons class that uses
  # the package's fonts.
  uses-material-design: true

  fonts:
    - family: BBIcons
      fonts:
        - asset: assets/icons/icon.ttf

  assets:
    - assets/
    - assets/images/
    - assets/markdown/
